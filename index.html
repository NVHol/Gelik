<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт управления машиной (STM32)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        h2 { margin: 5px 0 15px 0; font-size: 18px; color: #00ffcc; text-align: center;}
        .section {
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin: 10px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button {
            background-color: #2a2a2a;
            color: white;
            border: 2px solid #00ffcc;
            font-size: 16px;
            padding: 15px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            font-weight: bold;
            width: 100%;
        }
        button:active, button.pressed {
            background-color: #00ffcc;
            color: #121212;
        }
        #connectBtn {
            background-color: #00ffcc;
            color: #121212;
            font-size: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            width: auto;
        }
        .row {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        #status {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="connectBtn" onclick="connectBluetooth()">🔗 Подключить Bluetooth</button>

    <!-- Управление мотором (Команды 4, 5, 6) -->
    <div class="section">
        <h2>Мотор (Движение)</h2>
        <button onmousedown="sendCmd('4')" ontouchstart="sendCmd('4')" onmouseup="sendCmd('6')" ontouchend="sendCmd('6')">▲ Вперед (Команда 4)</button>
        <button onmousedown="sendCmd('5')" ontouchstart="sendCmd('5')" onmouseup="sendCmd('6')" ontouchend="sendCmd('6')">▼ Назад (Команда 5)</button>
        <button onclick="sendCmd('6')">⏹ Стоп / Сброс (Команда 6)</button>
    </div>

    <!-- Управление сервоприводом / Рулевым управлением (Команды 1, 2, 3) -->
    <div class="section">
        <h2>Руль / Сервопривод</h2>
        <div class="row">
            <button onclick="sendCmd('1')">◀ Влево<br>(60°)</button>
            <button onclick="sendCmd('2')">● Центр<br>(90°)</button>
            <button onclick="sendCmd('3')">▶ Вправо<br>(120°)</button>
        </div>
    </div>

    <p id="status">Статус: не подключено</p>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;

        // Стандартные UUID для прозрачных BLE UART модулей (E104-BT40 / Nordic UART)
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"; 
        const CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "Статус: поиск устройства...";
                
                // Фильтруем по имени BLE-модуля (например, 'CDEBYTE' или можно заменить на точное имя с первого фото)
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'CDEBYTE' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "Статус: Подключено к " + bluetoothDevice.name;
                let btn = document.getElementById('connectBtn');
                btn.innerText = "✓ Подключено";
                btn.style.backgroundColor = "#00cc66";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Статус: ошибка подключения или отменено";
            }
        }

        async function sendCmd(cmd) {
            if (!bluetoothCharacteristic) {
                console.log("Bluetooth не подключен");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(cmd));
            } catch (error) {
                console.error("Ошибка отправки: ", error);
            }
        }
    </script>
</body>
</html>
